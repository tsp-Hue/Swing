<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>Swing Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">Swing Tracker <span id="rules" class="pill"></span></div>
  <div id="status" class="status">Loading…</div>
</header>
<div id="banner" class="banner" hidden></div>
<main>
  <section id="tab-orders" class="tab"></section>
  <section id="tab-portfolio" class="tab" hidden></section>
  <section id="tab-journal" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden></section>
</main>
<nav>
  <button data-tab="orders" class="on">Orders</button>
  <button data-tab="portfolio">Portfolio</button>
  <button data-tab="journal">Journal</button>
  <button data-tab="settings">Settings</button>
</nav>
<dialog id="dlg"><form method="dialog" id="dlgForm"><h3 id="dlgTitle"></h3><div id="dlgFields"></div>
  <menu><button value="cancel" class="ghost">Cancel</button><button value="ok" class="primary" id="dlgOk">OK</button></menu></form></dialog>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
