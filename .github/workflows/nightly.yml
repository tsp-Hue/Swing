name: Nightly scan
on:
  schedule:
    - cron: '15 14 * * 1-5'   # 19:45 IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Restore EOD data cache
        uses: actions/cache@v4
        with:
          path: eod2
          key: eod2-${{ github.run_id }}
          restore-keys: eod2-
      - name: Get EOD2 + dataset
        run: |
          [ -d eod2/.git ] || git clone --depth 1 https://github.com/BennyThadikaran/eod2.git eod2
          [ -d eod2/src/eod2_data/daily ] || git clone --depth 1 https://github.com/BennyThadikaran/eod2_data.git eod2/src/eod2_data
      - name: Sync latest NSE data (EOD2)
        continue-on-error: true
        run: cd eod2/src && pip install -r ../requirements.txt && python init.py
      - name: Build signals
        run: python engine/nightly.py --data eod2/src/eod2_data --out web/data
      - name: Send exit / order alert (ntfy)
        continue-on-error: true
        env:
          POSITIONS: ${{ vars.POSITIONS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python engine/alerts.py --data eod2/src/eod2_data --signals web/data/signals.json
      - name: Show what will be published
        run: ls -la web web/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
